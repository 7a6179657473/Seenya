<div>
<h1>MAC Address Monitoring</h1>
<table>
  <thead>
    <tr>
      <th>MAC Address</th>
      <th>Signal Strength</th>
      <th>Last Seen</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let mac of macAddresses">
      <td>{{ mac.address }}</td>
      <td>{{ mac.signalStrength }}</td>
      <td>{{ mac.lastSeen | date:'shortTime' }}</td>
    </tr>
  </tbody>
</table>
</div>
